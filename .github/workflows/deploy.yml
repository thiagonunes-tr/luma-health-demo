name: Validate and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --requirement requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Run deterministic browser tests
        env:
          E2E_MFA_SESSION_SECRET: github-actions-e2e-only-secret-2026
        run: python tests/e2e/full_demo.py

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: test-results/e2e
          if-no-files-found: ignore

      - name: Build Cloudflare application
        run: npm run build

      - name: Build Vercel frontend
        run: npm --prefix vercel-frontend run build

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
